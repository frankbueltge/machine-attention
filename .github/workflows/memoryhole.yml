# Memory Hole V0 (admission stage 3, Frank's GO 2026-08-15): the nightly
# reading of the institutional wording, rechecked. Runs at 02:30 UTC because
# the CDX server is slow and unreliable — the audit budgets one to three hours
# for a night and measured a 19 % 504 rate under concurrency, so the reading
# needs its distance from the sentinel (05:45) and, above all, from the anchor
# job (06:20) that stamps the night's manifest.
#
# The model layer is optional by construction: without ANTHROPIC_API_KEY the
# run records "off: no key configured" in the reading and finishes. Nothing
# about the night depends on it.
name: memoryhole

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memoryhole

jobs:
  reading:
    runs-on: ubuntu-latest
    # Wayback answers in 1-60 s per query and a night asks it a hundred-odd
    # times; the default six-hour ceiling would let a bad night sit there.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install practice
        run: python -m pip install --quiet -e ./practice

      - name: Reading of the completed UTC day
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m practice.memoryhole.run --repo-root .

      # Same handshake as the sentinel and Dark Ocean: the night lists its
      # fresh manifests in the anchor ledger as "unstamped" so verify passes
      # and the commit lands; the anchor job stamps them later.
      # See tools/anchor.py, register().
      - name: Register the night in the anchor ledger
        run: python tools/anchor.py --register

      - name: Verify provenance chain
        run: python verify.py --repo-root .

      - name: Commit reading
        run: |
          git config user.name "Machine Attention"
          git config user.email "attention@machine-attention.invalid"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "memoryhole: reading of $(date -u -d 'yesterday' +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "push failed after 5 attempts" >&2
          exit 1
