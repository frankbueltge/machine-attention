# Anchoring (decision D2, Frank's GO 2026-08-09 for Dark Ocean and The Foreknown):
# put every night's manifest hash into a Bitcoin block via OpenTimestamps, so the
# registers' dates stop resting on self-asserted git commit times.
#
# Deliberately a SEPARATE job, running after the registers have committed:
# anchoring must never be able to break a register. If every calendar is down, the
# night's reading still landed and this job records the outage in the ledger.
#
# 06:20 UTC — behind darkocean (04:50) and the foreknown sentinel (05:45), so the
# manifests of the night are already on main. Each run also upgrades yesterday's
# still-pending proofs: a fresh stamp is four calendar promises, and only a later
# `ots upgrade` turns it into a proof that stands on Bitcoin alone.
name: anchor

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anchor

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The client lives here and only here: practice/ stays dependency-free and keyless,
      # and the anchoring tool shells out to `ots`. No account, no API key, no secret.
      - name: Install the OpenTimestamps client
        run: python -m pip install --quiet opentimestamps-client

      - name: Stamp new manifests, upgrade pending proofs
        run: python tools/anchor.py

      # verify.html reads the ledger this job just changed — how many nights carry a
      # completed proof, which blocks they rest on, which are still pending. Stamping
      # without rebuilding leaves the stage a stale render of a state that no longer
      # exists, and verify.py's deterministic-rebuild check (I1) fails from here until
      # something else happens to rebuild. The generator is stdlib-only and reads only
      # committed records, so this cannot fail on anchoring's account.
      - name: Rebuild the stage the ledger is rendered on
        run: python stage/generate.py --repo-root .

      # anchors/ and public/ and nothing else. The record trees are untouched by design,
      # and the append-only guard (I3) would refuse it anyway. public/ belongs in the same
      # commit as the ledger it renders, so no commit of this job's ever leaves the chain
      # with a hole in it.
      - name: Commit anchors and the stage they are rendered on
        run: |
          tools/commit-and-push.sh \
            "anchor: $(python -c 'import json;c=json.load(open("anchors/ledger.json"))["counts"];print(f"{c[\"stamped_this_run\"]} stamped, {c[\"upgraded_this_run\"]} upgraded, {c[\"complete\"]}/{c[\"manifests\"]} complete")')" \
            anchors public

      # The night's anchoring says for itself whether the chain is whole, instead of
      # leaving the next job to discover it. It runs AFTER the commit on purpose: a hole
      # found here is reported, never used to withhold a stamp — anchoring still cannot
      # break a register. Until today the only scheduled job that ran this check without
      # rebuilding first was darkocean, so an anchor run that outdated the stage surfaced
      # the next morning, in a project that is not even on the page that went stale.
      - name: Verify provenance chain
        if: always()
        run: python verify.py --repo-root .
