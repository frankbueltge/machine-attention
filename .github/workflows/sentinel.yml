# Until 2026-10-03 the nightly notary run of The Foreknown (project 001).
#
# The Foreknown was RETIRED on 2026-10-04 (foreknown/RETIRED.json,
# docs/2026-10-04-foreknown-retired.md): the notary step is gone, and nothing
# here may bring it back — verify.py fails any foreknown night recorded after
# the last one. What stays is everything else this job always did for the
# whole practice, because it was the only place that did it: the export and
# the stage moments the house mirrors for frankbueltge.de, and the stage
# rebuild, verified and committed under the machine's identity. Dark Ocean and
# Memory Hole run on, and their figures reach the house only through here.
name: sentinel

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel

jobs:
  notarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install practice
        run: python -m pip install --quiet -e ./practice

      # No notary step since 2026-10-04 (retired). No anchor registration
      # either: it existed to list each new notary night in the ledger, and
      # there are no new nights to list.
      - name: Rebuild stage
        run: python stage/generate.py --repo-root .

      # What the house may know about this practice: projects, statuses and
      # dated scalars, recomputed from committed records. The site mirrors it
      # beside the rendered stage (attention-export/1).
      - name: Export for frankbueltge.de
        if: always()
        run: python -m practice.export --repo-root .

      # What the projects offer the shared stage: real, dated events with a
      # plain statement and an address to enter (stage-moments/1). The site
      # mirrors it beside the export.
      - name: Stage moments
        if: always()
        run: python -m practice.moments --repo-root .

      # Both of the steps above build derived mirror files for the house. Neither
      # is the night's record, and verify.py reads neither — so neither may take
      # a notarized night down with it. It did: python -m practice.export raised
      # on 2026-09-04 and 2026-09-05, these two steps stayed red, and because the
      # two steps below default to success() they never ran at all. Both nights
      # were fetched, classified and then dropped with the container. Same shape
      # as the push-retry casualty of 2026-08-16 that tools/commit-and-push.sh
      # documents at its head: work completed, work never persisted, one step
      # earlier in the chain.
      #
      # always() on the gate, and the gate's own outcome on the commit: a night
      # that fails verify.py is still never committed, and a night that passes it
      # is committed even while a mirror file is broken. The job stays red either
      # way — the failure is reported, not absorbed.
      - name: Verify provenance chain
        id: verify
        if: always()
        run: python verify.py --repo-root .

      - name: Commit observation
        if: always() && steps.verify.outcome == 'success'
        run: |
          tools/commit-and-push.sh "export: house mirror of $(date -u +%F)"
