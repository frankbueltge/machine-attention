# The nightly notary run of The Foreknown (project 001). Same proven shape
# as state-before-interface: the run writes files, committing is a separate
# step under the machine's identity, deploy hangs off the push.
name: sentinel

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel

jobs:
  notarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install practice
        run: python -m pip install --quiet -e ./practice

      - name: Notarize announced futures
        run: python -m practice.foreknown.run --repo-root .

      # The night lists itself in the anchor ledger as "unstamped" (stdlib-only,
      # no ots client, append-only): verify.py demands every register night be
      # LISTED in the ledger, but only the anchor job can stamp, and it can only
      # reach manifests already on main. Without this handshake the two jobs
      # deadlock — they did, 2026-08-10 to 2026-08-12, and three nights recorded
      # nothing. BEFORE the stage rebuild: verify.html renders the ledger, and
      # the deterministic-rebuild check holds the stage against the ledger's
      # final state.
      - name: Register the night in the anchor ledger
        run: python tools/anchor.py --register

      - name: Rebuild stage
        run: python stage/generate.py --repo-root .

      # What the house may know about this practice: projects, statuses and
      # dated scalars, recomputed from committed records. The site mirrors it
      # beside the rendered stage (attention-export/1).
      - name: Export for frankbueltge.de
        if: always()
        run: python -m practice.export --repo-root .

      # What the projects offer the shared stage: real, dated events with a
      # plain statement and an address to enter (stage-moments/1). The site
      # mirrors it beside the export.
      - name: Stage moments
        if: always()
        run: python -m practice.moments --repo-root .

      - name: Verify provenance chain
        run: python verify.py --repo-root .

      - name: Commit observation
        run: |
          tools/commit-and-push.sh "foreknown: notary run of $(date -u +%F)"
