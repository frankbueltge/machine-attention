# The Interval V0 (admission stage 3, the maintainer's GO 2026-10-04): the
# weekly reading. Increment 5, docs/2026-10-13-the-interval-v0-inkrement-5.md.
#
# IPC changes a few times a month and FTS money for a closed episode not at
# all, so the reading is weekly, not nightly. Monday 04:50 UTC: the slot
# Dark Ocean held until its retirement, clear of memoryhole (02:30, up to
# four hours), the sentinel (05:45) and the anchor job (06:20) that stamps
# the manifest this run writes.
#
# What is fetched: the IPC national table (kept only when its bytes changed)
# and, per episode and flow set, the FTS pages unless the query is frozen
# (a complete snapshot taken more than three months after the episode's
# window). Identical page sets are not kept twice. Public, keyless sources
# only; the FEWS NET data warehouse is never fetched.
name: interval

on:
  schedule:
    - cron: "50 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interval

jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install practice
        run: python -m pip install --quiet -e ./practice

      # Writes interval/readings/<date>.json, any new snapshot, and the
      # rebuilt interval/register.json.
      - name: Weekly reading
        run: python -m practice.interval.weekly --repo-root .

      # Same handshake as memoryhole: a fresh manifest is listed in the
      # ledger as "unstamped" so verify passes; the anchor job stamps it.
      - name: Register the reading in the anchor ledger
        run: python tools/anchor.py --register

      - name: Verify provenance chain
        run: python verify.py --repo-root .

      - name: Commit reading
        run: |
          tools/commit-and-push.sh "interval: reading of $(date -u +%F)"
