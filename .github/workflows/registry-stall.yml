# Cause-agnostic staleness check (sensor-registry-stall.json, promoted
# 2026-09-07). A separate, always-succeeding job that only reads what
# checkout already put on disk and never writes a register itself, so
# whatever silently stalls the register it is checking (four distinct
# causes so far, none visible as a source outage or any other
# autonomy/log.jsonl entry -- see the proposal and
# practice/src/practice/staleness.py) cannot also silently stall this
# check. No verify.py step: this job never touches a register or the
# anchor ledger, so there is nothing for verify.py to check.
#
# Scheduled ahead of memoryhole (02:30), darkocean (04:50) and sentinel
# (05:45) so it reads last night's state before today's own writes land --
# staleness.py's module docstring explains why that ordering is
# load-bearing for the threshold.
name: registry-stall

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-stall

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install practice
        run: python -m pip install --quiet -e ./practice

      - name: Check every register's newest committed night
        run: python -m practice.staleness --repo-root .

      - name: Commit the check
        run: |
          tools/commit-and-push.sh "registry-stall: check of $(date -u +%F)" autonomy/log.jsonl
